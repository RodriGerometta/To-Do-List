<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <title>To-Do-List</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="wrap">

        <header>
            <!-- place navbar here -->
            <h1>Tareas</h1>
            <span class="count" id="contador">0 pendientes</span>
        </header>
        <main>
            <form id="form-nueva">
                <div class="row">
                    <input type="text" id="input-titulo" placeholder="Título de la tarea" required>
                </div>
                <div class="row">
                    <input type="text" id="input-desc" placeholder="Descripción (opcional)">
                    <button type="submit" class="btn-primary" id="btn-crear">Agregar</button>
                </div>
            </form>

            <ul id="lista"></ul>
        </main>
        <footer>
            <!-- place footer here -->
            Frontend generado con IA · Backend FastAPI + SQLAlchemy hecho a mano
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <script src="script.js"></script>
    </div>
</body>

</html>
